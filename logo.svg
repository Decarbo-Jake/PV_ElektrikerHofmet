<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  
  <!-- Orange Akzent oben -->
  <rect width="512" height="80" fill="#ff9500"/>
  
  <!-- Solarpanel Symbol -->
  <g transform="translate(128, 150)">
    <!-- Rahmen -->
    <rect x="0" y="0" width="256" height="160" fill="none" stroke="#ff9500" stroke-width="8" rx="8"/>
    
    <!-- Grid -->
    <line x1="85" y1="0" x2="85" y2="160" stroke="#ff9500" stroke-width="4"/>
    <line x1="170" y1="0" x2="170" y2="160" stroke="#ff9500" stroke-width="4"/>
    
    <line x1="0" y1="53" x2="256" y2="53" stroke="#ff9500" stroke-width="4"/>
    <line x1="0" y1="107" x2="256" y2="107" stroke="#ff9500" stroke-width="4"/>
    
    <!-- Solarzellen Highlights -->
    <circle cx="42" cy="27" r="8" fill="#ff9500" opacity="0.6"/>
    <circle cx="128" cy="27" r="8" fill="#ff9500" opacity="0.6"/>
    <circle cx="213" cy="27" r="8" fill="#ff9500" opacity="0.6"/>
    
    <circle cx="42" cy="80" r="8" fill="#ff9500" opacity="0.6"/>
    <circle cx="128" cy="80" r="8" fill="#ff9500" opacity="0.6"/>
    <circle cx="213" cy="80" r="8" fill="#ff9500" opacity="0.6"/>
    
    <circle cx="42" cy="133" r="8" fill="#ff9500" opacity="0.6"/>
    <circle cx="128" cy="133" r="8" fill="#ff9500" opacity="0.6"/>
    <circle cx="213" cy="133" r="8" fill="#ff9500" opacity="0.6"/>
  </g>
  
  <!-- Blitz/Energie Symbol -->
  <g transform="translate(220, 340)">
    <path d="M 36 0 L 0 40 L 24 40 L 12 80 L 48 40 L 24 40 Z" fill="#ff9500"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">HOFFMANN</text>
  <text x="256" y="485" font-family="Arial, sans-serif" font-size="20" fill="#ff9500" text-anchor="middle">METALLBAU</text>
