<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Logo Test</title>
    <style>
        body {
            padding: 50px;
            background: #f0f0f0;
        }
        .test-box {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border: 2px solid #ccc;
        }
        img {
            border: 2px solid red;
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Logo Test - Welches Logo wird angezeigt?</h1>
    
    <div class="test-box">
        <h2>1. Original PNG (logo-original.png)</h2>
        <img src="logo-original.png" width="200" alt="Original">
    </div>
    
    <div class="test-box">
        <h2>2. Logo PNG 512x512 (logo.png)</h2>
        <img src="logo.png" width="200" alt="Logo PNG">
    </div>
    
    <div class="test-box">
        <h2>3. Logo Header (logo-header.png)</h2>
        <img src="logo-header.png" width="200" alt="Logo Header">
    </div>
    
    <div class="test-box">
        <h2>4. Logo SVG (logo.svg)</h2>
        <img src="logo.svg" width="200" alt="Logo SVG">
    </div>
    
    <div class="test-box">
        <h2>5. Logo 192 (logo-192.png)</h2>
        <img src="logo-192.png" width="192" alt="Logo 192">
    </div>
</body>
</html>
